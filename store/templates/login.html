{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="{% static 'variable.css' %}" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <title>Login</title>
  </head>
  <body>
    <header class="container-header">
      <a href="{% url 'store:card-list' %}" class="header-logo">
        <span>ტექნიკის ოაზისი</span>
      </a>
      <div class="header-buttons">
        <a
          href="{% url 'store:card-list' %}"
          class="header-button btn-color"
          title="მთავარი"
          >მთავარი გვერდი</a
        >
      </div>
    </header>
    <div class="auth-container">
      <h2>შესვლა</h2>
      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">შესვლა</button>
      </form>
      <p class = "login-text">
        არ გაქვს ანგარიში? <a href="{% url 'store:register' %}">რეგისტრაცია</a>
      </p>
    </div>
  </body>
</html>
