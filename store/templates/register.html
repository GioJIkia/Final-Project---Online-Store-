<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <h2>რეგისტრაცია</h2>

    {% if messages %}
    <div>
      {% for message in messages %}
      <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">რეგისტრაცია</button>
    </form>

    <p>უკვე გაქვს ანგარიში? <a href="{% url 'store:login' %}">შესვლა</a></p>
  </body>
</html>
