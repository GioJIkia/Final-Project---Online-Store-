{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="{% static 'variable.css' %}" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <title>Register</title>
  </head>
  <body>
    <header class="container-header">
      <a
        href="{% url 'store:card-list' %}"
        class="header-logo"
        style="text-decoration: none"
      >
        <span
          style="
            color: var(--primary-coror-bright-cyan);
            font-weight: bold;
            font-size: 24px;
          "
          >ტექნიკის ოაზისი</span
        >
      </a>
      <div class="header-buttons">
        <a
          href="{% url 'store:card-list' %}"
          class="header-button btn-color"
          title="მთავარი"
          >მთავარი გვერდი</a
        >
      </div>
    </header>
    <div class="auth-container">
      <h2>რეგისტრაცია</h2>
      {% if messages %} {% for message in messages %}
      <p class="auth-error-message">{{ message }}</p>
      {% endfor %} {% endif %}
      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">რეგისტრაცია</button>
      </form>
      <p style="text-align: center; margin-top: 15px">
        უკვე გაქვს ანგარიში? <a href="{% url 'store:login' %}">შესვლა</a>
      </p>
    </div>
  </body>
</html>
